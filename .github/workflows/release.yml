name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            rust-target: x86_64-pc-windows-msvc
            bundle: nsis
          - platform: macos-latest
            rust-target: aarch64-apple-darwin
            bundle: dmg
          - platform: macos-13
            rust-target: x86_64-apple-darwin
            bundle: dmg
          - platform: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
            bundle: appimage

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libssl-dev libgtk-3-dev libayatana-appindicator3-dev \
            libsqlite3-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DevDash ${{ github.ref_name }}"
          releaseBody: |
            ## 🖥️ DevDash ${{ github.ref_name }}

            开发者晨间桌面伴侣 — 聚合 GitHub/GitLab 数据，Widget 化仪表盘

            ### 快速安装
            - **Windows**: 下载 `DevDash_x.x.x_x64-setup.exe`，双击安装
            - **macOS (Apple Silicon)**: 下载 `DevDash_x.x.x_aarch64.dmg`
            - **macOS (Intel)**: 下载 `DevDash_x.x.x_x64.dmg`
            - **Linux**: 下载 `.AppImage`，`chmod +x` 后运行

            ### 一键安装
            ```powershell
            # Windows PowerShell
            irm https://raw.githubusercontent.com/devdash/devdash/main/scripts/install.ps1 | iex
            ```
            ```bash
            # macOS / Linux
            curl -fsSL https://raw.githubusercontent.com/devdash/devdash/main/scripts/install.sh | bash
            ```

            ---

            **完整变更日志**: https://github.com/devdash/devdash/compare/${{ github.ref_name }}^...${{ github.ref_name }}
          releaseDraft: true
          prerelease: false

  # 验证构建产物
  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Verifying release assets for $TAG..."

          # 等待 release 创建
          sleep 10

          # 检查必要的资源文件
          ASSETS=$(gh release view "$TAG" --json assets -q '.assets[].name')

          echo "Assets found:"
          echo "$ASSETS"

          # 验证关键平台安装包
          for expected in "setup.exe" "dmg" "AppImage"; do
            if echo "$ASSETS" | grep -q "$expected"; then
              echo "✅ Found: $expected"
            else
              echo "⚠️  Missing: $expected"
            fi
          done
